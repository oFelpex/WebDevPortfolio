@if (isPlaying()) {
  <div id="undertale-effect-container">
    <div class="souls-orbit">
      @for (soul of souls; track soul.name) {
        <div class="soul-arm" [style.--angle]="soul.angle + 'deg'">
          @for (attack of attacksOf(soul); track attack.id) {
            <div class="attack" (animationend)="onAttackHit($event, attack)">
              <img
                class="attack-sprite"
                [style.animation-delay]="attack.spinDelay"
                [src]="spritesPath + soul.name + '-soul-attack.webp'"
                [alt]="
                  'THEMES.GAMES.UNDERTALE.ALT.' +
                    soul.name.toUpperCase() +
                    '-ATTACK' | translate
                "
              />
            </div>
          }
          <img
            class="soul"
            [src]="spritesPath + soul.name + '-soul.webp'"
            [alt]="
              'THEMES.GAMES.UNDERTALE.ALT.' + soul.name.toUpperCase() + '-SOUL'
                | translate
            "
          />
        </div>
      }
    </div>
    <img
      class="soul red-soul"
      [src]="spritesPath + 'red-soul.webp'"
      [alt]="'THEMES.GAMES.UNDERTALE.ALT.RED-SOUL' | translate"
    />
  </div>
}
