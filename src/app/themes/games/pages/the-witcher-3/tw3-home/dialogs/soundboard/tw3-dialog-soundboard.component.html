<mat-dialog-content id="soundboard-container">
  <div id="side-music-player">
    <mat-dialog-actions id="side-music-player-actions">
      <div id="side-music-player-buttons-container">
        <button
          class="side-music-player-button"
          (click)="playClickSound()"
          (mouseenter)="playMouseEnterOrLeaveSFX()"
        >
          <span class="corner corner-tl"></span>
          <span class="corner corner-tr"></span>
          <span class="corner corner-bl"></span>
          <span class="corner corner-br"></span>
          <mat-icon
            class="side-music-player-button-icon"
            aria-hidden="false"
            aria-label="left arrow icon"
            fontIcon="arrow_left"
          ></mat-icon>
        </button>
        <button
          class="side-music-player-button"
          (click)="playClickSound()"
          (mouseenter)="playMouseEnterOrLeaveSFX()"
        >
          <span class="corner corner-tl"></span>
          <span class="corner corner-tr"></span>
          <span class="corner corner-bl"></span>
          <span class="corner corner-br"></span>
          <mat-icon
            class="side-music-player-button-icon"
            aria-hidden="false"
            aria-label="play arrow icon"
            fontIcon="play_arrow"
          ></mat-icon>
        </button>
        <button
          class="side-music-player-button"
          (click)="playClickSound()"
          (mouseenter)="playMouseEnterOrLeaveSFX()"
        >
          <span class="corner corner-tl"></span>
          <span class="corner corner-tr"></span>
          <span class="corner corner-bl"></span>
          <span class="corner corner-br"></span>
          <mat-icon
            class="side-music-player-button-icon"
            aria-hidden="false"
            aria-label="right arrow icon"
            fontIcon="arrow_right"
          ></mat-icon>
        </button>
      </div>
    </mat-dialog-actions>
  </div>
  <div id="song-selection-container">
    <div id="song-selection">
      @for (tw3Music of tw3Musics; track $index) {
        <div
          class="tw3-card-container"
          (mouseenter)="playMouseEnterOrLeaveSFX()"
        >
          <div class="card-content-clip">
            <div class="card-motion-shine"></div>
          </div>
          <div class="card-static-shine left"></div>
          <div class="card-static-shine right"></div>
          <div class="card-border"></div>
          <img
            class="card-img"
            [src]="getCardFileName(tw3Music.musicName)"
            [alt]=""
          />
          <span class="card-title">{{ tw3Music.musicName }}</span>
          <p class="card-text">
            {{ tw3Music.musicComposer }}
          </p>
        </div>
      }
    </div>
    <mat-dialog-actions id="song-selection-up-menu">
      <h1 id="song-selection-up-menu-title">Cartas no baralho</h1>
      <button
        id="close-menu-button"
        mat-dialog-close
        (click)="playClickSound()"
        (mouseenter)="playMouseEnterOrLeaveSFX()"
      >
        <span>X</span>
      </button>
    </mat-dialog-actions>
  </div>
</mat-dialog-content>
