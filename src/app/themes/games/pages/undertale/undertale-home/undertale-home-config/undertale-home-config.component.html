<section id="undertale-settings" @undertaleOpenFromCenter>
  <div id="undertale-particles-container">
    @for (p of particles; track p.id) {
      <img
        [src]="p.src"
        [class]="'particle ' + p.animClass"
        [style.left.%]="p.left"
        [style.animation-duration.s]="p.duration"
        [style.animation-delay.s]="p.delay"
        [style.width.px]="p.size"
        alt="Seasonal particle"
      />
    }
  </div>
  <h1 id="undertale-config-title">SETTINGS</h1>
  <div id="undertale-config-options-container">
    <button
      class="btn"
      (mouseenter)="mouseEnterOrLeaveSFX()"
      (click)="onExit()"
    >
      <span>EXIT</span>
    </button>
    <button
      class="btn"
      (mouseenter)="mouseEnterOrLeaveSFX()"
      (click)="playClickSound()"
    >
      <span>LANGUAGE + lang</span>
    </button>
    <button
      class="btn"
      (mouseenter)="mouseEnterOrLeaveSFX()"
      (click)="playClickSound()"
    >
      <span>CHANGE THEME + theme</span>
    </button>
  </div>
  <div id="annoying-dog-and-his-message">
    <div id="dog-message-container">
      <span>{{ annoyingDog.phrasesFromTheDog }}</span>
    </div>
    <img
      [src]="annoyingDog.src"
      [class]="'annoyingDog ' + annoyingDog.animClass"
      [style.width.px]="annoyingDog.size"
      alt="Seasonal annoying dog"
    />
  </div>
</section>
