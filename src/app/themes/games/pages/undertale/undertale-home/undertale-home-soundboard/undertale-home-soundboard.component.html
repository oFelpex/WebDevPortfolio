<section id="undertale-soundboard" @fadeIn_fadeOut_longer>
  <img
    id="undertale-soundboard-bg"
    src="../../../../../../../assets/themes/games/undertale/sprites/others/soundboard/undertale-soundboard-bg.gif"
    alt="Deltarune music background"
  />
  <div id="undertale-soundboard-npcs-container">
    <img
      class="undertale-soundboard-npc-img"
      src="../../../../../../../assets/themes/games/undertale/sprites/others/soundboard/undertale-capn.gif"
      alt="Deltarune Cap'n gif"
    />
    <img
      class="undertale-soundboard-npc-img"
      src="../../../../../../../assets/themes/games/undertale/sprites/others/soundboard/undertale-sweet.gif"
      alt="Deltarune Sweet gif"
    />
    <img
      class="undertale-soundboard-npc-img"
      src="../../../../../../../assets/themes/games/undertale/sprites/others/soundboard/undertale-k_k.gif"
      alt="Deltarune K_K gif"
    />
  </div>
  <div id="undertale-soundboard-menu-container">
    <div id="undertale-soundboard-menu-selecting-music">
      <h1 class="undertale-soundboard-title">Choose a music</h1>

      <div id="undertale-soundboard-menu-music-list-and-btns">
        <ul id="undertale-soundboard-music-list-container">
          @for (music of visibleMusics(); track music) {
            <li class="undertale-soundboard-music-item">
              <span
                [class]="
                  music.musicName === currentMusic()
                    ? 'undertale-soundboard-music-item-span-playing'
                    : 'undertale-soundboard-music-item-span'
                "
                (mouseenter)="mouseEnterOrLeaveSFX()"
                (click)="playClickSound(); playPlaylistStartingOnThisOne(music)"
              >
                {{ music.musicName }}</span
              >
            </li>
          }
        </ul>
        <div id="undertale-soundboard-next-prev-btns-container">
          <button
            mat-button
            class="undertale-soundboard-next-prev-btn"
            (mouseenter)="mouseEnterOrLeaveSFX()"
            (click)="prevMusicOnTheList(); playClickSound()"
          >
            <mat-icon class="undertale-soundboard-next-prev-btn-icon"
              >arrow_drop_up</mat-icon
            >
          </button>
          <button
            mat-button
            class="undertale-soundboard-next-prev-btn"
            (mouseenter)="mouseEnterOrLeaveSFX()"
            (click)="playClickSound(); nextMusicOnTheList()"
          >
            <mat-icon class="undertale-soundboard-next-prev-btn-icon"
              >arrow_drop_down</mat-icon
            >
          </button>
        </div>
      </div>
      <button
        mat-button
        id="back-to-home-btn"
        (mouseenter)="mouseEnterOrLeaveSFX()"
        (click)="onExit(); playClickSound()"
      >
        Back
      </button>
    </div>
    <div id="undertale-soundboard-menu-playing">
      <div id="undertale-soundboard-menu-playing-content">
        @if (isPlayingSomeMusicFromThePlaylist) {
          <div id="undertale-soundboard-menu-playing-music-container">
            <div id="undertale-soundboard-menu-music-and-composer-container">
              <span class="music-and-composer">{{ currentMusic() }}</span>
              <span class="music-and-composer"> ● </span>
              <span class="music-and-composer">{{ currentComposer() }}</span>
            </div>

            <div id="undertale-soundboard-menu-playing-progress-bar-container">
              <mat-progress-bar
                mode="determinate"
                [value]="progress() * 100"
              ></mat-progress-bar>
            </div>
          </div>
        } @else {
          <h2 class="undertale-soundboard-title">Select a music</h2>
        }
        <div id="undertale-soundboard-menu-playing-btns-container">
          <button
            class="undertale-soundboard-menu-playing-btns"
            [disabled]="!isPlayingSomeMusicFromThePlaylist"
            mat-icon-button
            (mouseenter)="mouseEnterOrLeaveSFX()"
            (click)="playClickSound(); playPreviousMusic()"
          >
            <mat-icon>skip_previous</mat-icon>
          </button>
          <button
            class="undertale-soundboard-menu-playing-btns"
            [disabled]="!isPlayingSomeMusicFromThePlaylist"
            mat-icon-button
            (mouseenter)="mouseEnterOrLeaveSFX()"
            (click)="playClickSound(); pauseOrPlayMusic()"
          >
            <mat-icon>{{
              isPlaying() ? "pause_circle" : "play_circle"
            }}</mat-icon>
          </button>
          <button
            class="undertale-soundboard-menu-playing-btns"
            [disabled]="!isPlayingSomeMusicFromThePlaylist"
            mat-icon-button
            (mouseenter)="mouseEnterOrLeaveSFX()"
            (click)="playClickSound(); playNextMusic()"
          >
            <mat-icon>skip_next</mat-icon>
          </button>
        </div>
      </div>
    </div>
  </div>
</section>
