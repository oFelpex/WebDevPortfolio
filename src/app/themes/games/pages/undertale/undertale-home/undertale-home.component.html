<header id="undertale-home-header">
  @if (currentMenuState() === "mainMenu") {
    <section id="undertale-door-and-menu">
      <div id="undertale-door-with-soundboard-img">
        <img
          id="undertale-door"
          src="../../../../../../assets/themes/games/undertale/sprites/backgrounds/undertale-menu-door.webp"
          alt="Undertale Door"
        />
        <img
          id="undertale-soundboard-menu"
          src="../../../../../../assets/themes/games/undertale/sprites/others/soundboard/undertale-soundboard-menu.webp"
          alt="Undertale music location"
          (click)="
            playClickSound();
            unloadMusicsChangeMenuAndPreloadNewMusics('mainMenu', 'soundboard')
          "
        />
      </div>
      <div id="undertale-menu-container">
        <div id="undertale-menu-info">
          <span class="name">FELPEX</span>
          <span class="level">LV 1</span>
          <span class="time">1:32</span>

          <span class="location">Ruins - Entrance</span>
        </div>

        <div id="undertale-menu-btns">
          <button
            class="btn btn-navigate"
            (mouseenter)="mouseEnterOrLeaveSFX()"
            (click)="playClickSound(); openNaviationDialog()"
          >
            Navigate
          </button>
          <button
            class="btn btn-change-menu"
            (mouseenter)="mouseEnterOrLeaveSFX()"
            (click)="playClickSound(); changeMenuVariation()"
          >
            Change Menu
          </button>

          <button
            class="btn btn-settings"
            (mouseenter)="mouseEnterOrLeaveSFX()"
            (click)="
              playClickSound();
              unloadMusicsChangeMenuAndPreloadNewMusics(
                'mainMenu',
                'configMenu'
              )
            "
          >
            Settings
          </button>
        </div>
      </div>
    </section>
    <section id="undertale-floor-and-c">
      <div id="floor-stage">
        <img
          id="undertale-floor"
          src="../../../../../../assets/themes/games/undertale/sprites/backgrounds/undertale-menu-floor.webp"
          alt="Undertale Floor"
        />
        <div id="characters-container">
          <ng-container *ngComponentOutlet="variation()" />
        </div>
      </div>

      <span id="undertale-copyright"
        >UNDERTALE V1.08 (C) TOBY FOX 2015-2026</span
      >
    </section>
  } @else if (currentMenuState() === "configMenu") {
    <app-undertale-home-config
      (exit)="
        unloadMusicsChangeMenuAndPreloadNewMusics('configMenu', 'mainMenu')
      "
    />
  } @else if (currentMenuState() === "soundboard") {
    <app-undertale-home-soundboard
      (exit)="
        unloadMusicsChangeMenuAndPreloadNewMusics('soundboard', 'mainMenu')
      "
    ></app-undertale-home-soundboard>
  }
</header>
